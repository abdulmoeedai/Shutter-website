
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUTTER Photography</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:white;font-family:Arial}
header{padding:22px 8%;display:flex;justify-content:space-between;
align-items:center;position:sticky;top:0;background:#080808}
.logo{font-size:25px;font-weight:bold;letter-spacing:3px}
nav a{color:white;text-decoration:none;margin-left:22px}
nav a:hover{color:#ff725e}
section{padding:55px 8%}
h1{font-size:42px;margin-bottom:12px}
p{color:#aaa;margin-bottom:30px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.gallery img{width:100%;height:260px;object-fit:cover;
border-radius:5px;transition:.3s}
.gallery img:hover{transform:scale(1.03)}
#contact{background:#111}
input,textarea{width:100%;padding:14px;margin:8px 0 15px;
background:#222;border:1px solid #444;color:white;border-radius:4px}
button{background:#ff725e;color:white;border:0;padding:14px 25px;
cursor:pointer;border-radius:25px}
footer{text-align:center;padding:22px;color:#888}
@media(max-width:650px){
.gallery{grid-template-columns:repeat(2,1fr)}
.gallery img{height:190px}
h1{font-size:30px}
header{padding:18px 5%}
nav a{margin-left:10px;font-size:14px}
section{padding:40px 5%}
}
</style>
</head>

<body>

<header>
<div class="logo">SHUTTER.</div>
<nav>
<a href="#home">Home</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section id="home">
<h1>Capture The Moment.</h1>
<p>Beautiful photography. Unforgettable memories.</p>

<div class="gallery">
<img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Mountains">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Landscape">
<img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600" alt="Portrait">
<img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600" alt="Ocean">
<img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest">
<img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Nature">
</div>
</section>

<section id="contact">
<h1>Contact Me</h1>
<p>Have a project in mind? Let's talk.</p>

<form action="mailto:your-email@example.com" method="post"
enctype="text/plain">
<input type="text" name="Name" placeholder="Your Name" required>
<input type="email" name="Email" placeholder="Your Email" required>
<input type="text" name="Subject" placeholder="Subject" required>
<textarea name="Message" rows="5" placeholder="Your Message"
required></textarea>
<button type="submit">SEND MESSAGE ↗</button>
</form>
</section>

<footer>© 2026 SHUTTER Photography</footer>

</body>
</html>
